<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Budget</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f6f7f9;
  color: #17191c;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.app {
  max-width: 500px;
  margin: auto;
  padding: 30px 20px 110px;
}

h1 {
  font-size: 30px;
  margin: 0 0 6px;
}

.subtitle {
  color: #7a7f87;
  margin-bottom: 25px;
}

/* MOIS */

.month-select {
  width: 100%;
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 15px;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 18px;
}

/* CARTE BUDGET */

.balance {
  background: #eef4ff;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 16px;
}

.balance small {
  color: #657084;
}

.balance h2 {
  font-size: 36px;
  margin: 8px 0;
}

.progress {
  height: 7px;
  background: #dbe4f3;
  border-radius: 10px;
  overflow: hidden;
  margin-top: 16px;
}

.progress div {
  width: 38%;
  height: 100%;
  background: #4776e6;
}

/* RÉSUMÉ */

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 18px;
  border: 1px solid #eceef1;
}

.card span {
  display: block;
  color: #858a92;
  font-size: 14px;
  margin-bottom: 7px;
}

.card strong {
  font-size: 22px;
}

/* CATÉGORIES */

.section-title {
  margin: 28px 0 14px;
  font-size: 19px;
}

.category {
  background: white;
  border: 1px solid #eceef1;
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}

/* MENU BAS */

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(255,255,255,.96);
  border-top: 1px solid #e8e8e8;
  padding: 12px 12px 25px;
}

.nav-inner {
  max-width: 500px;
  margin: auto;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.nav-item {
  font-size: 12px;
  color: #777;
  text-align: center;
}

.nav-item.active {
  color: #4776e6;
  font-weight: 600;
}

.add {
  background: #4776e6;
  color: white;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}
</style>
</head>

<body>

<div class="app">

  <h1>Mon budget</h1>
  <div class="subtitle">Gérez simplement vos dépenses</div>

  <select class="month-select">
    <option>Septembre 2026</option>
    <option>Octobre 2026</option>
    <option>Novembre 2026</option>
    <option>Décembre 2026</option>
    <option>Janvier 2027</option>
  </select>

  <div class="balance">
    <small>Budget restant</small>
    <h2>1 240 €</h2>
    <small>sur 2 000 €</small>

    <div class="progress">
      <div></div>
    </div>
  </div>

  <div class="summary">

    <div class="card">
      <span>Dépensé</span>
      <strong>760 €</strong>
    </div>

    <div class="card">
      <span>Budget</span>
      <strong>2 000 €</strong>
    </div>

  </div>

  <h3 class="section-title">Mes catégories</h3>

  <div class="category">
    <span>🍔 Restaurants</span>
    <strong>120 €</strong>
  </div>

  <div class="category">
    <span>🛒 Courses</span>
    <strong>285 €</strong>
  </div>

  <div class="category">
    <span>🎮 Loisirs</span>
    <strong>95 €</strong>
  </div>

</div>

<nav>
  <div class="nav-inner">

    <div class="nav-item active">
      ◉<br>Budget
    </div>

    <div class="nav-item">
      ≡<br>Transactions
    </div>

    <div class="add">+</div>

    <div class="nav-item">
      ♡<br>Commun
    </div>

  </div>
</nav>

</body>
</html>
